<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>TRUE Phone Link</title>
<link rel="stylesheet" href="fluent.css">
<style>
  /* The window itself is acrylic (set by the app); this tint matches the Quick Settings flyout. */
  html, body { background: transparent; overflow: hidden; user-select: none; cursor: default; }
  .flyout { width: 100vw; background: rgba(40, 40, 40, 0.72); }
  .top { padding: 18px 20px 6px; }

  .device { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .phone { width: 30px; height: 64px; border-radius: 6px; flex: none; background: #000 var(--wallpaper, none) center / cover;
           box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 2px 6px rgba(0,0,0,0.3); }
  .off .phone { filter: grayscale(1) brightness(0.6); }
  .device .name { font-weight: 600; }
  .device .meta { display: flex; align-items: center; gap: 6px; }
  .ok { color: #6ccb5f; }

  .tiles { display: grid; grid-template-columns: repeat(3, 96px); gap: 12px; justify-content: space-between; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .btn-tile { width: 96px; height: 48px; border-radius: 4px; display: flex; overflow: hidden;
              background: var(--control); border: 1px solid var(--control-border); }
  .btn-tile > div:hover { background: rgba(255,255,255,0.04); }
  .btn-tile .main { flex: 1; display: flex; align-items: center; justify-content: center; }
  .btn-tile .more { width: 32px; display: flex; align-items: center; justify-content: center; border-left: 1px solid rgba(0,0,0,0.25); }
  .btn-tile.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-tile.on > div:hover { background: rgba(255,255,255,0.12); }
  .btn-tile.disabled { opacity: 0.45; pointer-events: none; }
  .tile .label { font-size: 12px; line-height: 16px; text-align: center; }

  .row { display: flex; align-items: center; gap: 12px; height: 48px; }
  .meter { flex: 1; display: flex; gap: 2px; align-items: center; height: 20px; }
  .meter span { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); }
  .meter span.lit { background: var(--accent); }
  input[type=range] { flex: 1; -webkit-appearance: none; appearance: none; height: 20px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
      background: linear-gradient(to right, var(--accent) var(--fill, 50%), rgba(255,255,255,0.54) var(--fill, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%;
      background: #454545 radial-gradient(circle, var(--accent) 5.5px, transparent 6px); border: 1px solid rgba(255,255,255,0.09); }
  .val { width: 26px; text-align: right; font-size: 12px; color: var(--text-2); }

  .status { margin: 4px -20px 0; padding: 8px 20px 12px; border-top: 1px solid var(--divider); }
  .status:empty { display: none; }
  .line { display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 6px 0; }
  .line + .line { border-top: 1px solid rgba(255,255,255,0.04); }
  .line .txt { flex: 1; }
  .line .muted { color: var(--text-2); font-size: 12px; line-height: 16px; }
  .link { cursor: pointer; }
  .link:hover { text-decoration: underline; }

  /* InfoBar for questions ("VALORANT.exe is running…") and the "moved back" notice. */
  .bar { margin: 0 20px 12px; padding: 10px 12px; border-radius: 4px; background: var(--card); border: 1px solid var(--stroke); }
  .bar:empty { display: none; }
  .bar .acts { display: flex; gap: 8px; margin-top: 8px; }
  .btn { cursor: pointer; }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .footer { height: 48px; background: rgba(32, 32, 32, 0.6); border-top: 1px solid rgba(0,0,0,0.3);
            display: flex; align-items: center; padding: 0 12px 0 20px; gap: 6px; }
  .footer .grow { flex: 1; display: flex; align-items: center; gap: 8px; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-3); }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; margin-right: 4px; }
  .btn.small:hover { background: var(--control-hover); }
  .line .link { flex: none; }
  .icon-btn { width: 36px; height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--subtle-hover); }
</style>
</head>
<body>
<div class="flyout" id="flyout">
  <div class="top">
    <div class="device">
      <div class="phone"></div>
      <div>
        <div class="name" id="name">Your phone</div>
        <div class="meta caption" id="meta"></div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile">
        <div class="btn-tile" id="t-mic">
          <div class="main" data-act="toggle_mic"><i class="i" style="--i:url(icons/mic_20_filled.svg)"></i></div>
          <div class="more" data-open="microphone"><i class="i i16" style="--i:url(icons/chevron_right_16_regular.svg)"></i></div>
        </div>
        <div class="label">Phone mic</div>
      </div>
      <div class="tile">
        <div class="btn-tile" id="t-audio">
          <div class="main" data-act="toggle_audio"><i class="i" style="--i:url(icons/speaker_2_20_filled.svg)"></i></div>
          <div class="more" data-open="audio"><i class="i i16" style="--i:url(icons/chevron_right_16_regular.svg)"></i></div>
        </div>
        <div class="label" id="audio-label">Phone to speaker</div>
      </div>
      <div class="tile">
        <div class="btn-tile" id="t-auto">
          <div class="main" data-act="toggle_auto"><i class="i" style="--i:url(icons/flow_20_regular.svg)"></i></div>
        </div>
        <div class="label">Smart auto</div>
      </div>
    </div>

    <div class="row" style="margin-top: 14px">
      <i class="i" style="--i:url(icons/mic_20_regular.svg)"></i>
      <div class="meter" id="meter"></div>
      <span class="val num" id="level"></span>
    </div>
    <div class="row">
      <i class="i" style="--i:url(icons/speaker_2_20_regular.svg)"></i>
      <input type="range" id="volume" min="0" max="100" value="50" aria-label="Phone volume">
      <span class="val num" id="volume-val"></span>
    </div>

    <div class="status" id="status"></div>
  </div>
  <div class="bar" id="bar"></div>

  <div class="footer">
    <div class="grow caption"><span>TRUE Phone Link</span><span class="dot" id="delay-dot"></span><span class="num" id="delay"></span></div>
    <div class="btn small" id="pause" data-act="toggle_pause"></div>
    <div class="icon-btn" data-open="home" title="Open TRUE Phone Link"><i class="i" style="--i:url(icons/open_20_regular.svg)"></i></div>
    <div class="icon-btn" data-open="connection" title="Settings"><i class="i" style="--i:url(icons/settings_20_regular.svg)"></i></div>
  </div>
</div>
<script src="common.js"></script>
<script src="flyout.js"></script>
</body>
</html>
