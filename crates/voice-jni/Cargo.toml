[package]
name = "tpl-voice-jni"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "JNI bridge so the phone server (app_process, shell uid) can run the Rust voice chain"

[lib]
name = "tpl_voice_jni"
crate-type = ["cdylib"]

[dependencies]
tpl-voice = { path = "../voice" }
jni = "0.21"
