name: test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    name: Smart auto, desktop and handshake (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The handshake tests compile the phone's Java with plain javac (no Android SDK) and run it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The Tauri build script checks that the bundled phone files exist. The tests don't use them, and building the
      # real ones needs the Android SDK, so CI puts empty stand-ins where they go.
      - name: Stand-in phone artefacts
        shell: bash
        run: mkdir -p phone-server/out && touch phone-server/out/tpl-server.jar phone-server/out/libtpl_voice_jni.so
      - name: Smart auto scenarios, desktop unit tests and the session handshake
        run: cargo test -p tpl-policy -p tpl-desktop -p tpl-auth

  handshake:
    name: Session handshake, PC against the phone's Java (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: handshake
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: A connection without the session key is refused
        run: cargo test -p tpl-auth

  voice:
    name: Voice chain (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Voice chain unit tests
        run: cargo test -p tpl-voice
      # tract only builds the DeepFilterNet graph in release, so the strength test is #[ignore]d in debug.
      - name: DeepFilterNet strength test (release)
        run: cargo test --release -p tpl-voice -- --include-ignored
